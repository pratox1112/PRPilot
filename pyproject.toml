[project]
name = "prpilot"
version = "0.1.0"
description = "Event-driven pull request triage agent with approval-gated write actions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic==2.14.1",
    "pydantic-ai-slim[openai]==2.61.0",
    "python-dotenv==1.2.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]
screening = [
    "en-core-web-lg",
    "huggingface-hub==2.3.0",
    "presidio-analyzer==2.2.362",
    "presidio-anonymizer==2.2.365",
    "torch==2.14.1",
    "transformers==5.20.2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["prpilot_core", "prpilot_data"]
module-root = ""

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
