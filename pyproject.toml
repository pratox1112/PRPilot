[project]
name = "prpilot"
version = "0.1.0"
description = "Event-driven pull request triage agent with approval-gated write actions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pydantic==2.14.1",
    "pydantic-ai-slim[openai]==2.61.0",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prpilot_core"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
