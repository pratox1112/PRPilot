[project]
name = "prpilot-eval"
version = "0.1.0"
description = "PRPilot eval harness: scores model replies against maintainer targets. Imports no app code."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prpilot_eval"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
