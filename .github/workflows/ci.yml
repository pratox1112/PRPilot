name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      screening:
        description: "on: normal run. off: one-time check that the red-team suite fails without screening."
        type: choice
        options: ["on", "off"]
        default: "on"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # postgres:17.10-bookworm, the same digest as docker-compose.yml
        image: postgres@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_USER: prpilot
          POSTGRES_PASSWORD: prpilot
          POSTGRES_DB: prpilot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U prpilot" --health-interval 2s --health-retries 30
    env:
      # CI-only throwaway database in the service container above.
      PRPILOT_TEST_DATABASE_URL: postgresql+asyncpg://prpilot:prpilot@localhost:5433/prpilot_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --locked --group data

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Migrations match the models
        env:
          DATABASE_URL: ${{ env.PRPILOT_TEST_DATABASE_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

      - name: Unit tests
        run: uv run pytest

      - name: Eval harness tests (own project and lock)
        working-directory: eval
        run: uv run --locked pytest

  redteam-screening:
    # Promptfoo red-team regression (roadmap §7.4): synthetic injected PRs through the real
    # screening step; fails if any canary would reach the triage model. No model runs here.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRPILOT_SCREENING: ${{ github.event.inputs.screening || 'on' }}
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install screening dependencies from lockfile
        run: uv sync --locked --group screening

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Cache PromptGuard weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--meta-llama--Llama-Prompt-Guard-2-86M
          key: prompt-guard-2-86M-a8ded8e697ce7c355e395a0df51f94adb4a2fd27

      - name: Red-team suite (Promptfoo)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROMPTFOO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npx --yes promptfoo@0.125.1 eval -c redteam/promptfoo/promptfooconfig.yaml --no-cache --max-concurrency 1

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
