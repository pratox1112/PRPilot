# Repo label -> shared PR type (roadmap §4.3). Configuration written from label names and
# descriptions, not from reading PRs. Shared types:
#   bug | feature | docs | refactor | test | ci/build | dependency | other
# Labels not listed here are not type labels (area, process, backport, size, release-branch).
# Lines marked REVIEW are judgement calls for the owner to confirm.

[repos."numpy/numpy"]
"00 - Bug" = "bug"
"06 - Regression" = "bug"
"01 - Enhancement" = "feature"
"04 - Documentation" = "docs"
"05 - Testing" = "test"
"36 - Build" = "ci/build"
"component: CI" = "ci/build"
"Dependencies" = "dependency"
"03 - Maintenance" = "refactor"  # REVIEW: numpy MAINT = cleanup/refactor, sometimes CI/deps
"41 - Static typing" = "other"   # REVIEW
"07 - Deprecation" = "other"

[repos."pandas-dev/pandas"]
"Bug" = "bug"
"Regression" = "bug"
"Enhancement" = "feature"
"Docs" = "docs"
"Testing" = "test"
"Unreliable Test" = "test"
"CI" = "ci/build"
"Build" = "ci/build"
"Dependencies" = "dependency"
"Refactor" = "refactor"
"Clean" = "refactor"
"Code Style" = "refactor"
"Performance" = "other"          # REVIEW: no performance type in the shared taxonomy
"Typing" = "other"               # REVIEW
"Deprecate" = "other"

